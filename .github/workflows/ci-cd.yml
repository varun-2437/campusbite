name: CampusBite CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Backend & Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'admin-dashboard/package-lock.json'

      # Test Admin Dashboard Web Build
      - name: Install & Build Admin Dashboard
        run: |
          cd admin-dashboard
          npm install
          npm run build

      # Run Core Integration Test Suite
      - name: Run Integration Lifecycle Tests
        run: |
          node integration-tests/order_lifecycle.js

  deploy-render-and-vercel:
    name: Auto Deploy to Production (Render & Vercel)
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to Render Web Service
        run: |
          echo "Triggering Render Backend Webhook Deployment..."
          # curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Deploy Dashboard to Vercel
        run: |
          echo "Deploying Admin Dashboard to Vercel..."
          # npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod
